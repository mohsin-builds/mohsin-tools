name: Validate Mohsin Tools release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Validate tool directory
        run: node tests/directory.mjs
      - name: SEO metadata and sitemap validation
        run: node tests/seo.mjs
      - name: Build static output
        run: node scripts/build.mjs
      - name: Static output validation
        run: python3 tests/static_check.py